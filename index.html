<!DOCTYPE html>
<html>
<head>
    <title>Bergara Guessr - PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#e67e22">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #000; }
        #street-view { height: 100vh; width: 100vw; position: absolute; z-index: 1; }
        
        #map-container { 
            position: absolute; bottom: 20px; right: 20px; 
            width: 300px; height: 250px; z-index: 10; 
            transition: all 0.3s ease-in-out; border: 4px solid white; 
            border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
            background: white; overflow: hidden; 
        }
        #map-container.fullscreen { width: 90vw; height: 70vh; bottom: 5vh; right: 5vw; }
        #map { width: 100%; height: 100%; }
        
        #toggle-map { position: absolute; top: 10px; left: 10px; z-index: 11; background: rgba(255,255,255,0.9); border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #confirm-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 12; background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 18px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        #ui { position: absolute; top: 20px; left: 20px; z-index: 20; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 220px; border-left: 6px solid #e67e22; }
        .main-btn { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; display: block; text-align: center; text-decoration: none; }
        
        /* Estilos del Ranking Dinámico */
        #ranking-lista { margin-top: 10px; background: #fff; border-radius: 8px; max-height: 150px; overflow-y: auto; font-size: 13px; border: 1px solid #eee; }
        .rank-item { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #eee; }
        .rank-item:last-child { border: none; }
        .gold { color: #d4af37; font-weight: bold; }

        @media (max-width: 600px) {
            #map-container { width: 150px; height: 150px; }
            #ui { width: 180px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div id="street-view"></div>
    
    <div id="map-container">
        <button id="toggle-map" onclick="toggleMapSize()">⤢ Pantalla</button>
        <div id="map"></div>
        <button id="confirm-btn" onclick="confirmGuess()">Confirmar Ubicación</button>
    </div>

    <div id="ui">
        <div id="round-label" style="font-weight:bold; color:#666;">Ronda 1 / 3</div>
        <div id="timer" style="font-size:18px; color:#dc3545; font-weight:bold;">Tiempo: 0.0s</div>
        <div id="score" style="font-size:24px; font-weight:bold;">Total: 0</div>
        <div id="distance" style="color:#666; font-size:12px; margin-bottom:10px;">Busca el sitio en Bergara</div>
        
        <button id="action-btn" class="main-btn" onclick="spawnRandomLocation()" style="display:none;">Siguiente Ronda</button>
        
        <div id="ranking-container">
            <h4 style="margin: 10px 0 5px 0; font-size: 14px;">Top 10 Bergara</h4>
            <div id="ranking-lista">Cargando clasificación...</div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN GLOBAL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9AQQpD0Js18177u3WFglgn6Uk3-fJ4FES1QR2gkoDN4HFvLSQ2qCMLIf0zBVpluAJ/exec";
        const SHEET_ID = "1yBRWSFIp_P73DiV-lhfJ_uu4FUAvsgz-tFd1-Vb2-oU"; 

        let panorama, map, marker, targetMarker, targetLocation, line;
        let totalScore = 0, currentRound = 1, startTime, timerInterval;
        let totalDistance = 0, totalTime = 0;
        let lastClickedLatLng = null, hasGuessed = false;
        const MAX_ROUNDS = 3;
        const BERGARA_BOUNDS = { north: 43.145, south: 43.080, west: -2.450, east: -2.380 };

        function initGame() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 43.117, lng: -2.413 }, zoom: 14, disableDefaultUI: true, mapTypeId: 'roadmap'
            });
            panorama = new google.maps.StreetViewPanorama(document.getElementById("street-view"), {
                addressControl: false, showRoadLabels: false, zoomControl: true
            });
            map.addListener("click", (e) => {
                if (hasGuessed) return;
                lastClickedLatLng = e.latLng;
                if (marker) marker.setMap(null);
                marker = new google.maps.Marker({ position: lastClickedLatLng, map: map, label: "TÚ" });
                document.getElementById("confirm-btn").style.display = "block";
            });
            spawnRandomLocation();
            actualizarRankingVisual();
        }

        function toggleMapSize() {
            const container = document.getElementById("map-container");
            container.classList.toggle("fullscreen");
            google.maps.event.trigger(map, "resize");
        }

        function spawnRandomLocation() {
            if (currentRound > MAX_ROUNDS) { location.reload(); return; }
            if (marker) marker.setMap(null); if (targetMarker) targetMarker.setMap(null); if (line) line.setMap(null);
            marker = null; hasGuessed = false;
            document.getElementById("round-label").innerText = `Ronda ${currentRound} / ${MAX_ROUNDS}`;
            document.getElementById("action-btn").style.display = "none";
            document.getElementById("confirm-btn").style.display = "none";

            const sv = new google.maps.StreetViewService();
            const findLoc = () => {
                const rLat = Math.random() * (BERGARA_BOUNDS.north - BERGARA_BOUNDS.south) + BERGARA_BOUNDS.south;
                const rLng = Math.random() * (BERGARA_BOUNDS.east - BERGARA_BOUNDS.west) + BERGARA_BOUNDS.west;
                sv.getPanorama({ location: {lat: rLat, lng: rLng}, radius: 1000 }, (data, status) => {
                    if (status === "OK") {
                        targetLocation = data.location.latLng;
                        panorama.setPano(data.location.pano);
                        startTime = Date.now();
                        if(timerInterval) clearInterval(timerInterval);
                        timerInterval = setInterval(() => {
                            document.getElementById("timer").innerText = `Tiempo: ${((Date.now() - startTime) / 1000).toFixed(1)}s`;
                        }, 100);
                    } else { findLoc(); }
                });
            };
            findLoc();
        }

        function confirmGuess() {
            hasGuessed = true;
            clearInterval(timerInterval);
            const timeRound = (Date.now() - startTime) / 1000;
            document.getElementById("confirm-btn").style.display = "none";
            
            targetMarker = new google.maps.Marker({ position: targetLocation, map: map, label: "OK" });
            line = new google.maps.Polyline({ path: [lastClickedLatLng, targetLocation], strokeColor: "#FF0000", strokeWeight: 3, map: map });

            const dist = google.maps.geometry.spherical.computeDistanceBetween(lastClickedLatLng, targetLocation);
            const pts = Math.round((5000 * Math.exp(-dist / 600)) * Math.max(0.1, 1 - (timeRound / 90)));
            
            totalScore += pts;
            totalDistance += dist;
            totalTime += timeRound;
            
            document.getElementById("score").innerText = `Total: ${totalScore}`;
            document.getElementById("distance").innerText = `+${pts} pts (${dist.toFixed(0)}m)`;
            
            const btn = document.getElementById("action-btn");
            btn.style.display = "block";
            
            if (currentRound === MAX_ROUNDS) {
                btn.innerText = "FINALIZAR Y GUARDAR";
                btn.style.background = "#27ae60";
                btn.onclick = () => {
                    let nombre = prompt("¡Fin del juego! Introduce tu nombre para el ranking:", "Jugador");
                    if(nombre) enviarPuntuacion(nombre);
                };
            } else { currentRound++; btn.innerText = "Siguiente Ronda"; }
        }

        async function enviarPuntuacion(nombre) {
            const btn = document.getElementById("action-btn");
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const datos = new URLSearchParams();
            datos.append("nombre", nombre);
            datos.append("puntos", totalScore);
            datos.append("distancia", totalDistance.toFixed(0));
            datos.append("tiempo", totalTime.toFixed(1));

            try {
                // Envío mediante POST al script de Google
                await fetch(SCRIPT_URL, { method: 'POST', body: datos, mode: 'no-cors' });
                btn.innerText = "¡PUNTOS GUARDADOS!";
                btn.style.background = "#3498db";
                // Esperamos un poco y refrescamos el ranking visual
                setTimeout(actualizarRankingVisual, 2000);
            } catch (e) {
                alert("Error al guardar puntuación.");
                btn.disabled = false;
                btn.innerText = "REINTENTAR";
            }
        }

        async function actualizarRankingVisual() {
            // Consulta a la pestaña "Top 10" del Google Sheets
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Top%2010`;
            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const filas = json.table.rows;
                let html = "";
                filas.forEach((f, i) => {
                    let n = f.c[0] ? f.c[0].v : "---";
                    let p = f.c[1] ? f.c[1].v : "0";
                    let icon = i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}.`;
                    html += `<div class="rank-item"><span>${icon} ${n}</span><span class="gold">${p}</span></div>`;
                });
                document.getElementById("ranking-lista").innerHTML = html;
            } catch (e) {
                document.getElementById("ranking-lista").innerHTML = "Error al cargar clasificación.";
            }
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDBqsKR977KyYJ9rRBW8du_Ac9-EW4uZHg&libraries=geometry&callback=initGame"></script>
</body>
</html>
